<!doctype html><html lang="en-GB"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zachnite</title>
<style>
  /* Layout: one-screen lobby (modes + reward, loadout below); play screens pin a custom keyboard to the bottom. Single night-sky look by choice. */
  :root{
    color-scheme:dark;
    --night:#130a35; --dusk:#3b1d92; --storm:#8d45ff; --sky:#2bb6ff;
    --loot:#ffe14a; --loot-deep:#c79a00; --ink:#120733;
    --fg:#ffffff; --fg-dim:#cdc6f2; --panel:#22125c; --panel-2:#2e1a78; --line:#5b45bd;
    --hit:#4fe480; --miss:#ff5d73;
    --r0:#a3abc0; --r1:#57d662; --r2:#41adff; --r3:#bb6cff; --r4:#ff9a2e; --r5:#ffe14a; --r6:#5ff2ff;
    /* device fonts only, so the page needs nothing from the network */
    --display:"Avenir Next Condensed","Arial Narrow","Arial Black",Impact,sans-serif;
    --body:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  .disp,.top .name,.btn,.mode .mt,.hud .tag,.reward h2,.form h2,.k.go{font-weight:800!important;text-transform:uppercase}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(120% 90% at 50% 0%,var(--dusk) 0%,var(--night) 70%) fixed var(--night);color:var(--fg);
    font:600 17px/1.4 var(--body);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
  #app{height:100%;max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:12px}
  button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
  :focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  h1,h2,h3,p{margin:0}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-dim)}
  .disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.95;transform:skew(-6deg);
    text-shadow:0 4px 0 var(--ink);text-wrap:balance}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;flex:none}
  .top .name{font-family:var(--display);font-size:22px;transform:skew(-6deg);color:var(--loot);text-shadow:0 2px 0 var(--ink)}
  .top .sp{flex:1}
  .ghost{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:700;font-size:15px}
  section{flex:1;min-height:0;display:flex;flex-direction:column}

  /* buttons */
  .btn{background:var(--loot);color:var(--ink);font-family:var(--display);font-size:24px;letter-spacing:.03em;
    padding:14px 28px 10px;border-radius:6px;box-shadow:0 6px 0 var(--loot-deep);transform:skew(-6deg)}
  .btn:active{transform:skew(-6deg) translateY(4px);box-shadow:0 2px 0 var(--loot-deep)}
  .btn.alt{background:var(--sky);box-shadow:0 6px 0 #1273b0}
  .btn.alt:active{box-shadow:0 2px 0 #1273b0}
  .btn.small{font-size:18px;padding:10px 18px 7px}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}

  /* lobby */
  #s-lobby{overflow-y:auto;gap:14px}
  .lobby{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
  .hero{display:flex;flex-direction:column;gap:14px;min-width:0}
  .hero h1.logo img{display:block;width:min(100%,560px);height:auto;filter:drop-shadow(0 6px 0 var(--ink))}
  .ans.static::after{display:none}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{text-align:left;border-radius:8px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
    border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
  .mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
  .mode.train{background:linear-gradient(160deg,var(--sky),#1668d8)}
  .mode.battle{background:linear-gradient(160deg,var(--storm),#5a1fc4)}
  .mode .mt{font-family:var(--display);font-size:clamp(26px,4vw,38px);transform:skew(-6deg);transform-origin:left;text-shadow:0 3px 0 var(--ink)}
  .mode .md{font-size:16px;font-weight:600;line-height:1.3}
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
  .reward{display:flex;flex-direction:column;gap:10px}
  .reward h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;transform:skew(-6deg);transform-origin:left}
  .state{align-self:flex-start;font-size:13px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:4px;
    background:var(--panel-2);border:2px solid var(--line);color:var(--fg-dim)}
  .reward.open{border-color:var(--loot)}
  .reward.open .state{background:var(--loot);border-color:var(--loot);color:var(--ink)}
  .pips{display:flex;flex-wrap:wrap;gap:6px}
  .pip{width:26px;height:26px;border-radius:5px;border:2px solid var(--line);background:var(--panel-2)}
  .pip.on{background:var(--loot);border-color:var(--loot)}
  .log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
  .log b{color:var(--fg)}
  .note{font-size:15px;color:var(--fg-dim)}
  .toast{background:var(--panel-2);border:2px solid var(--hit);border-radius:6px;padding:10px 14px}
  .warn{border-color:var(--miss)}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
  .card{background:var(--panel-2);border-radius:6px;padding:12px 12px 10px;text-align:left;border:2px solid var(--c);
    border-bottom-width:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
  .card .w{font-size:20px;font-weight:700;overflow-wrap:anywhere}
  .card.glow{box-shadow:0 0 18px -2px var(--c)}
  .card .r{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
  .pat{color:var(--loot)}

  /* play */
  .hud{display:flex;align-items:center;gap:10px;flex:none}
  .hud .tag{font-family:var(--display);font-size:20px;transform:skew(-6deg);text-shadow:0 2px 0 var(--ink)}
  .hud .stat{margin-left:auto;display:flex;gap:8px}
  .chip{background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:5px 10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .chip b{color:var(--loot);font-size:17px}
  .chip.clean b{color:var(--hit)} .chip.lost b{color:var(--miss)}
  .bar{height:8px;background:var(--panel);border-radius:4px;overflow:hidden;flex:none}
  .bar i{display:block;height:100%;background:var(--storm);transition:width .3s}
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:8px}
  .word{font-size:clamp(44px,9vw,92px);font-weight:800;letter-spacing:.03em;line-height:1;overflow-wrap:anywhere}
  .clue{font-size:clamp(18px,2.6vw,24px);max-width:36ch;color:var(--fg-dim);line-height:1.35}
  .means{font-size:clamp(18px,2.6vw,24px);max-width:36ch;line-height:1.35;background:var(--panel);border:2px solid var(--sky);border-radius:8px;padding:10px 16px}
  .means b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
  .ends{font-size:16px;color:var(--fg-dim)} .ends b{color:var(--loot);font-size:20px}
  .sndtip{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;max-width:640px;margin:0 auto;text-align:left;
    background:var(--panel-2);border:2px solid var(--loot);border-radius:8px;padding:12px 16px;font-size:16px;line-height:1.4;box-shadow:0 6px 0 var(--ink)}
  .sndtip b{color:var(--loot)} .sndtip u{color:var(--sky);font-weight:800}
  .blank{display:inline-block;width:4.5em;border-bottom:3px solid var(--loot);vertical-align:-2px}
  .hear{background:var(--panel-2);border:2px solid var(--sky);border-radius:999px;padding:10px 22px;font-size:18px;font-weight:700}
  .hear:active{background:var(--sky);color:var(--ink)}
  .ans{min-width:min(100%,9em);min-height:1.35em;padding:2px 14px;font-size:clamp(34px,6.5vw,62px);font-weight:800;letter-spacing:.06em;line-height:1.25;
    border-bottom:5px solid var(--loot);overflow-wrap:anywhere}
  .ans::after{content:"";display:inline-block;width:3px;height:.9em;background:var(--loot);margin-left:4px;vertical-align:-.08em;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .verdict{font-size:clamp(40px,8vw,80px)}
  .verdict.hit{color:var(--hit)} .verdict.miss{color:var(--miss)}
  .diff{font-size:clamp(30px,6vw,54px);font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere}
  .diff .ok{color:var(--hit)} .diff .bad{color:var(--miss);text-decoration:underline wavy}
  .kb{flex:none;display:flex;flex-direction:column;gap:7px;padding-bottom:4px}
  .kr{display:flex;gap:6px;justify-content:center}
  .k{flex:1 1 0;max-width:88px;height:clamp(46px,7.4vh,70px);border-radius:6px;background:var(--panel-2);border:2px solid var(--line);
    border-bottom-width:5px;font-size:clamp(20px,3vw,30px);font-weight:700;padding:0}
  .k:active,.k.down{background:var(--storm);transform:translateY(2px)}
  .k.wide{flex:1.6 1 0;max-width:140px;font-size:clamp(15px,2.2vw,20px)}
  .k.go{flex:3 1 0;max-width:420px;background:var(--loot);color:var(--ink);border-color:var(--loot-deep);font-family:var(--display);font-weight:400;letter-spacing:.04em}
  .diff .x{color:var(--miss);text-decoration:line-through} .diff .gap{color:var(--miss)}

  /* mistakes log: right-hand column on wide screens, a strip under the word on narrow ones */
  .arena{flex:1;min-height:0;display:flex;gap:16px}
  .arena .stage{flex:1;min-width:0}
  .efforts{flex:none;width:280px;align-self:center;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px}
  .efforts.miss{border-color:var(--miss)}
  .efforts h3{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;transform:skew(-6deg);transform-origin:left;text-shadow:0 2px 0 var(--ink)}
  .efforts.miss h3{color:var(--miss)}
  .efforts ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .efforts li{background:var(--panel-2);border-radius:6px;border-left:4px solid var(--miss);padding:6px 12px 8px}
  .efforts li .diff{display:block;font-size:24px;letter-spacing:.04em}
  .efforts small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)}
  .efforts .new{animation:pop .6s ease-out}
  @keyframes pop{from{transform:scale(1.08);background:#6a1f4a}}

  /* results */
  #s-result{overflow-y:auto}
  .res{margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:720px;width:100%;padding-block:10px}
  .res .place{font-size:clamp(70px,14vw,140px);color:var(--loot)}
  .res .big{font-size:clamp(40px,8vw,84px)}
  .stamp{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .missed{width:100%;display:grid;gap:8px;text-align:left}
  .missed .m{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 14px;font-size:22px;font-weight:700}
  .missed small{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-dim);font-weight:700}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:12px;height:18px;animation:fall 3.2s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  /* grown-ups */
  #s-parent{overflow-y:auto;-webkit-user-select:text;user-select:text}
  .form{display:grid;gap:14px;max-width:720px;width:100%;margin:0 auto;padding-block:6px}
  .form label{display:grid;gap:6px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
  .form input,.form textarea{font:600 18px/1.4 var(--body);color:var(--fg);background:var(--night);border:2px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
  .form textarea{min-height:250px;resize:vertical}
  .form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form h2{font-family:var(--display);font-weight:400;font-size:34px;transform:skew(-6deg);transform-origin:left}

  @media (max-width:900px){
    .arena{flex-direction:column;gap:8px}
    .efforts{width:auto;align-self:stretch;max-height:none;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px}
    .efforts h3{font-size:16px;flex:none}
    .efforts ol{flex-direction:row}
    .efforts li{flex:none;padding:3px 10px 5px}
    .efforts li .diff{font-size:19px}
    .efforts .hint,.efforts.empty{display:none}
  }
  @media (max-width:820px){
    .lobby{grid-template-columns:1fr}
    .cards{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:480px){
    .modes,.form .two,.missed .m{grid-template-columns:1fr}
    .kr{gap:4px} .k{border-width:1px;border-bottom-width:4px}
    .hud .tag{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="top">
    <span class="name">Zachnite</span><span class="sp"></span>
    <button class="ghost" id="topbtn" data-act="parent">Grown-ups</button>
  </div>
  <button class="sndtip" id="sndtip" hidden data-act="tipclose"><b>Can't hear the word?</b> Turn the volume up and check the iPad isn't on silent (swipe down from the top-right corner and check the bell). <u>Got it</u></button>
  <section id="s-lobby"></section>
  <section id="s-play" hidden></section>
  <section id="s-result" hidden></section>
  <section id="s-parent" hidden></section>
</div>

  /* ---- play ---- */
  var ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
  function kbHTML(){
    var h='<div class="kb">';
    ROWS.forEach(function(r,ri){h+='<div class="kr">';
      if(ri===2)h+='<button class="k wide" data-k="-">-</button>';
      r.split('').forEach(function(c){h+='<button class="k" data-k="'+c+'">'+c+'</button>';});
      if(ri===2)h+='<button class="k wide" data-k="\'">\'</button><button class="k wide" data-k="del" aria-label="Delete">&#9003;</button>';
      h+='</div>';});
    return h+'<div class="kr"><button class="k go" data-k="go">LOCK IN</button></div></div>';
  }
  function cur(){return state.words[game.list[game.i]];}
  function renderPlay(){
    var g=game, w=cur(), n=g.list.length, battle=g.mode==='battle', body='', kb='';
    var hits=g.results.filter(function(r){return r.ok;}).length, misses=g.results.length-hits;
    var hud='<div class="hud"><button class="ghost" data-act="quit">'+(quitArmed?'Tap again to quit':'Quit')+'</button>'+
      '<span class="tag">'+(battle?'Battle':'Training')+'</span><div class="stat">'+
      (battle?'<span class="chip">Opponents left <b>'+(n-hits)+'</b></span><span class="chip '+(misses?'lost':'clean')+'"><b>'+(misses?misses+' missed':'Flawless')+'</b></span>'
             :'<span class="chip">Word <b>'+(g.i+1)+'</b> of '+n+'</span>')+
      '</div></div><div class="bar"><i style="width:'+Math.round(100*g.i/n)+'%"></i></div>';
    if(g.phase==='look'){
      body='<p class="eyebrow">Look at it. Say it. Spot the tricky bit.</p><div class="word">'+hl(w.w)+'</div>'+
        means(w)+'<p class="clue">'+esc(w.s||'')+'</p>'+ends(w)+'<div class="row"><button class="hear" data-act="hear">&#128266; Hear it</button>'+
        '<button class="btn" data-act="cover">Cover it and spell</button></div>';
    }else if(g.phase==='spell'){
      body='<p class="eyebrow">'+(battle?'Word '+(g.i+1)+' of '+n:'Covered. Spell it from memory.')+'</p>'+
        '<button class="hear" data-act="hear">&#128266; Hear the word</button>'+means(w)+'<p class="clue">'+blank(w.s,w.w)+'</p>'+
        '<div class="ans" id="ans" aria-live="polite">'+esc(g.typed)+'</div>';
      kb=kbHTML();
    }else if(g.phase==='confirm'){
      body='<p class="eyebrow">Check your spelling. You only get one shot.</p><div class="ans static">'+esc(g.typed)+'</div>'+
        '<p class="clue">'+blank(w.s,w.w)+'</p><div class="row"><button class="btn alt" data-act="change">Change it</button>'+
        '<button class="btn" data-act="confirm">Yes, lock it in</button></div>';
    }else if(g.phase==='flash'){
      var ok=g.results[g.results.length-1].ok;
      body='<div class="disp verdict '+(ok?'hit':'miss')+'">'+(ok?'Eliminated!':'Missed')+'</div>';
    }else if(g.phase==='right'){
      body='<div class="disp verdict hit">Nailed it</div><div class="word">'+hl(w.w)+'</div>'+
        means(w)+'<p class="clue">'+RARITY[lvl(w.w)]+' word</p><button class="btn" data-act="next">'+(g.i+1<n?'Next word':'Finish')+'</button>';
    }else if(g.phase==='wrong'){
      body='<p class="eyebrow">You typed</p><div class="diff">'+diff(g.typed,w.w)+'</div>'+
        '<p class="eyebrow">It should be</p><div class="word">'+hl(w.w)+'</div>'+means(w)+
        '<button class="btn" data-act="look">Look again</button>';
    }
    var side='';
    if(!battle){ // Battle stays a clean test: mistakes only show in Training
      var at=(state.attempts||{})[w.w]||[];
      side='<aside class="panel efforts'+(at.length?' miss':' empty')+'" aria-live="polite"><h3>Previous efforts</h3>'+
        (at.length?'<ol>'+at.map(function(a,k){
          return '<li'+(k===0&&g.phase==='wrong'?' class="new"':'')+'><small>'+(a.m==='battle'?'Battle':'Training')+' · '+esc(ago(a.ts))+'</small><span class="diff">'+diff(a.t,w.w)+'</span></li>';}).join('')+
          '</ol><p class="note hint">Red letters are wrong, crossed-out letters are extra, and _ is a missing letter.</p>'
          :'<p class="note">No mistakes on this word yet.</p>')+'</aside>';
    }
    $('#s-play').innerHTML=hud+'<div class="arena"><div class="stage">'+body+'</div>'+side+'</div>'+kb;
    show('play');
  }
  function start(mode,list){
    quitArmed=0;
    game={mode:mode,list:list,i:0,typed:'',results:[],phase:mode==='battle'?'spell':'look'};
    renderPlay();
    if(mode==='battle') sayWord(cur(),true);
  }
  function key(k){
    var g=game; if(!g||g.phase!=='spell')return;
    if(k==='go'){ lockIn(); return; }
    if(k==='del') g.typed=g.typed.slice(0,-1);
    else if(g.typed.length<24) g.typed+=k;
    var a=$('#ans'); if(a)a.textContent=g.typed;
  }
  function lockIn(){
    var g=game, w=cur(); if(!g.typed)return;
    if(g.mode==='battle'){ g.phase='confirm'; g.confirmAt=Date.now(); renderPlay(); return; }
    var ok=g.typed.toLowerCase()===w.w.toLowerCase();
    if(!ok) logMiss(w.w,g.typed,'train');
    bump(w.w,ok?1:-1,3); save(); g.phase=ok?'right':'wrong'; beep(ok?[660,880]:[220,180]); renderPlay();
  }
  function commit(){
    var g=game, w=cur();
    if(!g||g.phase!=='confirm'||Date.now()-g.confirmAt<600)return; // a fast double tap cannot confirm
    var ok=g.typed.toLowerCase()===w.w.toLowerCase();
    g.results.push({i:g.list[g.i],typed:g.typed,ok:ok});
    if(!ok) logMiss(w.w,g.typed,'battle');
    bump(w.w,ok?1:-1,6); beep(ok?[660,880,1100]:[220,180]);
    g.phase='flash'; renderPlay();
    setTimeout(function(){ if(game!==g)return;
      g.i++; g.typed='';
      if(g.i>=g.list.length){ finish(); return; }
      g.phase='spell'; renderPlay(); sayWord(cur(),true);
    },950);
  }
  function finish(){
    var g=game, n=g.list.length, miss=g.results.filter(function(r){return !r.ok;}), score=n-miss.length, ts=Date.now();
    state.history.unshift({ts:ts,score:score,total:n,missed:miss.map(function(r){return state.words[r.i].w;})});
    state.history=state.history.slice(0,40);
    if(score===n) state.wins.push(ts);
    save(); hush();
    var h='';
    if(score===n){
      beep([523,659,784,1047,1319]);
      var conf=''; var cols=['--loot','--sky','--storm','--hit','--r4'];
      for(var i=0;i<36;i++)conf+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:var('+cols[i%5]+');animation-delay:'+(Math.random()*1.2).toFixed(2)+'s"></i>';
      var open=unlocked();
      h='<div class="confetti">'+conf+'</div><div class="res"><div class="disp place">#1</div><div class="disp big">Victory Royale</div>'+
        '<p class="stamp">'+n+' out of '+n+' · '+esc(when(ts))+'</p>'+
        '<div class="panel reward'+(open?' open':'')+'" style="width:100%;align-items:center"><p class="eyebrow">Reward</p><h2>'+esc(state.reward)+'</h2>'+
        '<span class="state" style="align-self:center">'+(open?'UNLOCKED':'LOCKED')+'</span>'+
        '<p class="note">'+(open?'Show this screen to your grown-up.':'Perfect Battles: '+state.wins.length+' of '+state.need+'. Keep going.')+'</p></div>'+
        '<div class="row"><button class="btn" data-act="lobby">Back to lobby</button></div></div>';
    }else{
      var rows=miss.map(function(r){var w=state.words[r.i].w;
        return '<div class="m"><div><small>You typed</small><span class="diff" style="font-size:inherit">'+diff(r.typed,w)+'</span></div><div><small>Correct</small>'+hl(w)+'</div></div>';}).join('');
      g.missed=miss.map(function(r){return r.i;});
      h='<div class="res"><div class="disp place">#'+(miss.length+1)+'</div><div class="disp big">'+score+' out of '+n+'</div>'+
        '<p class="clue">So close. Train the '+(miss.length===1?'word':'words')+' you missed, then drop back in.</p>'+
        '<div class="missed">'+rows+'</div>'+
        '<div class="row"><button class="btn alt" data-act="trainmissed">Train missed words</button><button class="btn" data-act="battle">Battle again</button>'+
        '<button class="ghost" data-act="lobby">Lobby</button></div></div>';
    }
    $('#s-result').innerHTML=h; show('result');
  }

  /* ---- grown-ups ---- */
  function renderParent(){
    var h='<div class="form">';
    if(state.pin&&!parentOpen){
      h+='<h2>Grown-ups only</h2><label for="pin-in">PIN<input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>'+
        '<p class="note" id="pin-msg"></p><div class="row" style="justify-content:flex-start"><button class="btn small" data-act="pinok">Open</button><button class="ghost" data-act="lobby">Back</button></div></div>';
      $('#s-parent').innerHTML=h; show('parent'); return;
    }
    var hist=state.history.map(function(r){return '<li><b>'+r.score+'/'+r.total+'</b> · '+esc(when(r.ts))+(r.missed.length?' · missed '+esc(r.missed.join(', ')):'')+'</li>';}).join('');
    h+='<h2>Grown-ups</h2>'+
      '<div class="two"><label for="p-reward">Reward<input id="p-reward" type="text" value="'+esc(state.reward)+'"></label>'+
      '<label for="p-need">Perfect Battles needed (1 to 10)<input id="p-need" type="number" min="1" max="10" value="'+state.need+'"></label></div>'+
      '<div class="two"><label for="p-label">Week label<input id="p-label" type="text" value="'+esc(state.label)+'"></label>'+
      '<label for="p-pattern">Letters to highlight · comma for more than one<input id="p-pattern" type="text" value="'+esc(state.pattern)+'" autocapitalize="off" autocorrect="off"></label></div>'+
      '<label for="p-words">This week\'s words · one per line · word | sentence | meaning<textarea id="p-words" autocapitalize="off" autocorrect="off" spellcheck="false">'+
        esc(state.words.map(function(x){return x.w+' | '+(x.s||'')+(x.m?' | '+x.m:'');}).join('\n'))+'</textarea></label>'+
      '<label for="p-pin">'+(state.pin?'Change PIN':'Set a PIN so this screen stays locked')+'<input id="p-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="'+(state.pin?'Leave blank to keep it':'4 digits')+'"></label>'+
      '<p class="note" id="p-msg">Changing the word list starts a new week: word levels and wins go back to zero.</p>'+
      '<div class="row" style="justify-content:flex-start"><button class="btn small" data-act="psave">Save</button>'+
      '<button class="btn small alt" data-act="preset">Reward given, reset wins</button><button class="ghost" data-act="lobby">Back</button></div>'+
      '<p class="eyebrow" style="margin-top:8px">Battle history · '+state.wins.length+' perfect since last reset</p>'+
      '<ul class="log">'+(hist||'<li>No Battles yet.</li>')+'</ul></div>';
    $('#s-parent').innerHTML=h; show('parent');
  }

  var acts={
    lobby:function(){parentOpen=false;renderLobby();},
    train:function(){var idx=state.words.map(function(_,i){return i;}).sort(function(a,b){return lvl(state.words[a].w)-lvl(state.words[b].w);});start('train',idx);},
    trainone:function(b){start('train',[+b.dataset.i]);},
    trainmissed:function(){start('train',(game&&game.missed)||[]);},
    battle:function(){start('battle',shuffle(state.words.map(function(_,i){return i;})));},
    hear:function(){var w=cur(); if(game.phase==='look'){speak(w,['w','m','s']);return;} sayWord(w,game.mode==='battle');},
    confirm:function(){commit();},
    change:function(){if(game&&game.phase==='confirm'){game.phase='spell';renderPlay();}},
    cover:function(){game.phase='spell';game.typed='';renderPlay();sayWord(cur(),false);},
    look:function(){game.phase='look';renderPlay();},
    next:function(){game.i++;if(game.i>=game.list.length){toast='Training complete. Ready for Battle?';renderLobby();return;}game.phase='look';game.typed='';renderPlay();},
    quit:function(){
      if(game.mode==='battle'&&!quitArmed){quitArmed=1;renderPlay();setTimeout(function(){if(quitArmed&&game){quitArmed=0;if(game.phase==='spell'){var t=game.typed;renderPlay();game.typed=t;var a=$('#ans');if(a)a.textContent=t;}}},3000);return;}
      quitArmed=0;hush();renderLobby();},
    parent:function(){renderParent();},
    tipclose:function(){tip(false);},
    pinok:function(){if($('#pin-in').value===state.pin){parentOpen=true;renderParent();}else{$('#pin-msg').textContent='That PIN is not right.';}},
    psave:function(){
      var words=$('#p-words').value.split('\n').map(function(l){var p=l.split('|');return {w:(p[0]||'').trim().toLowerCase(),s:(p[1]||'').trim(),m:(p.slice(2).join('|')||'').trim()};}).filter(function(x){return x.w;});
      if(!words.length){$('#p-msg').textContent='Add at least one word before saving.';return;}
      var was=state.words.map(function(x){return x.w;}).join(','), now=words.map(function(x){return x.w;}).join(',');
      if(was!==now){state.mastery={};state.attempts={};state.wins=[];}
      state.words=words;
      state.reward=$('#p-reward').value.trim()||'Reward';
      state.need=Math.max(1,Math.min(10,parseInt($('#p-need').value,10)||1));
      state.label=$('#p-label').value.trim();
      state.pattern=$('#p-pattern').value.trim().toLowerCase();
      var pin=$('#p-pin').value.trim(); if(pin){state.pin=pin;parentOpen=true;}
      save(); toast='Saved.'; parentOpen=false; renderLobby();
    },
    preset:function(){state.wins=[];save();toast='Wins reset. The reward is locked again.';parentOpen=false;renderLobby();}
  };

  var app=$('#app');
  app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b);});
  document.addEventListener('pointerdown',prime,true); document.addEventListener('touchend',prime,true);
  app.addEventListener('pointerdown',function(e){var b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();key(b.dataset.k);});
  document.addEventListener('keydown',function(e){
    if(!game||e.metaKey||e.ctrlKey||e.altKey)return;
    var k=e.key;
    if(game.phase==='confirm'){
      if(k==='Enter'&&!e.repeat){e.preventDefault();commit();}
      else if(k==='Backspace'){e.preventDefault();acts.change();}
      return;
    }
    if(game.phase!=='spell')return;
    if(k==='Backspace'){e.preventDefault();key('del');}
    else if(k==='Enter'){e.preventDefault();key('go');}
    else if(/^[a-zA-Z'\-]$/.test(k)){e.preventDefault();key(k.toLowerCase());}
  });

  renderLobby();
})();
</script>
</body></html>
